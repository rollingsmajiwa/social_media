{% extends 'landing/base.html' %}
{% load static %}


{% block content %}
<div class="container">
    <div class="row justify-content-centre mt-3">
    <div class="col-md-5 col-sm-12 border-b">
       <h5>Add a Post!</h5>
    </div>
</div>

<div class="container">
    <div class="row justify-content-centre mt-3">
    <div class="col-md-5 col-sm-12 border-b">
      <form method="POST">
        {% csrf_token %}
       {{ form.body }}
    <button type="submit" class="mt-3 px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg">
        Post
    </button>
      </form>
    </div>
</div>

    {% for post in posts %}
<div class="row justify-content-centre mt-3">
    <div class="col-md-5 col-sm-12 border-b">
        <p><strong>{{ post.author}}</strong> {{ post.created_on }}</p>
        <p>{{ post.body }}</p>

    </div>

</div>
{% empty %}
<p>No post available yet!</p>
{% endfor %}
</div>


{% endblock %}
