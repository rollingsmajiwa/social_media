{% extends 'landing/base.html' %}

{% block content %}
<div class="container mx-auto mt-10 max-w-md bg-gray-800 text-white p-6 rounded-xl shadow-lg border border-gray-700">
    <h2 class="text-2xl font-bold mb-6 text-center">Edit Profile</h2>
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium mb-1">First Name</label>
            {{ u_form.first_name }}
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Last Name</label>
            {{ u_form.last_name }}
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            {{ u_form.email }}
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Profile Picture</label>
            {{ p_form.profile_pic }}
        </div>
        <div class="flex justify-between items-center mt-6">
            <a href="{% url 'profile_view' request.user.id %}" class="text-gray-400 hover:text-white text-sm">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg text-sm">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
