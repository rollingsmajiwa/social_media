{% extends 'landing/base.html' %}
{% load static %}


{% block content %}
<div class="container">
    <div class="row mt-5">
    <div class="col-md-5 col-sm-6 border-b">
       <a href="{% url 'post_lists' %}">Back to Feed</a>
    </div>
</div>
<div class="row justify-content-centre mt-3">
    <div class="col-md-5 col-sm-12 border-b">
        <p><strong>{{ post.author}}</strong> {{ post.created_on }}</p>
        <p>{{ post.body }}</p>

    </div>

</div>


    <div class="row justify-content-centre mt-3">
    <div class="col-md-5 col-sm-12">
      <form method="POST">
        {% csrf_token %}
       {{ form.comment }}
    <button type="submit" class="mt-3 px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg">
        Submit
    </button>
    {% if request.user == post.author %}
    <div class="flex space-x-3 mt-4">
        <a href="{% url 'post_edit' post.pk %}" class="text-sm text-blue-400 hover:underline">Edit Post</a>
        <a href="{% url 'post_delete' post.pk %}" class="text-sm text-red-400 hover:underline">Delete Post</a>
    </div>
    {% endif %}
      </form>
    </div>
</div>
</div>

{% endblock %}
