{% extends 'landing/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-12 p-6 bg-gray-900 rounded-lg shadow-lg text-white">
    <h2 class="text-xl font-bold mb-2 text-red-500">Delete Post?</h2>
    <p class="text-gray-300 mb-6">Are you sure you want to delete this post? This action cannot be undone.</p>
    
    <form method="POST">
        {% csrf_token %}
        <div class="flex space-x-3">
            <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">Confirm Delete</button>
            <a href="{% url 'post_details' post.pk %}" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded-lg font-medium">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
