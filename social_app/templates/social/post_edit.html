{% extends 'landing/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto mt-8 p-6 bg-gray-900 rounded-lg shadow-lg text-white">
    <h2 class="text-xl font-bold mb-4">Edit Post</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.body }}
        <div class="flex space-x-3 mt-4">
            <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">Save Changes</button>
            <a href="{% url 'post_details' post.pk %}" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded-lg font-medium">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
