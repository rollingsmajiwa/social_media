{% extends "landing/base.html" %}
{% load static %}



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Social Media{% endblock %}</title>
</head>
<body>
{%  block content %}
    <div class="container">
        <div class="row justify-centre mt-5">
            <div class="col-md-10 col-sm-12 text-center">
                <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-blue-950 leading-tight">Connect With your friends</h1>
                <p class="mt-4 text-lg md:text-xl text-gray-600 max-w-2xl mx-auto font-normal leading-relaxed">Follow people who interest you, stay upto date with news and join conversations</p>
                
            </div>
        </div>
    </div>
{%  endblock %}
    
</body>
</html>
