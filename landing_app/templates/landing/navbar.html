<nav class="bg-gray-900 border-b border-blue-900/50 shadow-lg text-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            
            <div class="flex items-center space-x-3">
                <a href="{% url 'index' %}" class="flex items-center space-x-2 text-blue-500 hover:text-blue-400 font-bold text-xl tracking-wide transition">
                    <span class="text-white">Friendz<span class="text-blue-500">Connect</span></span>
                </a>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                        
                    </span>
                    <input type="text" placeholder="Search friends, posts, or tags" class="w-full bg-gray-800 text-gray-100 text-sm rounded-full pl-10 pr-4 py-2 border border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent placeholder-gray-400 transition">
                </div>
            </div>

            <!-- Dynamic Auth Navigation Links -->
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <span class="text-sm font-medium text-gray-300 hidden sm:inline">
                        Welcome, <span class="text-blue-400 font-semibold">{{ user.username }}</span>
                    </span>
                    <a href="{% url 'index' %}" class="px-3 py-2 text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-800 rounded-md transition">
                        Feed
                    </a>
                    <form method="post" action="{% url 'logout' %}" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-gray-200 hover:text-white bg-red-700 hover:bg-red-600 rounded-lg transition">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="px-4 py-2 text-sm font-medium text-gray-300 hover:text-blue-400 transition">
                        Log In
                    </a>
                    <a href="{% url 'register' %}" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 rounded-lg shadow-md transition transform active:scale-95">
                        Sign Up
                    </a>
                {% endif %}
            </div>

        </div>
    </div>
</nav>
